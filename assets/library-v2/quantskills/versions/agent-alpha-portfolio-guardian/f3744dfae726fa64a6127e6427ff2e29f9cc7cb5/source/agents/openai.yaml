schema_version: 1.0
name: agent-alpha-portfolio-guardian
description: >
  Multi-factor portfolio health guardian. Orchestrates factor-evaluate, factor-decay,
  crowding-risk-monitor, and smart-money-profiler to produce a health matrix,
  crowding alerts, retire/rebuild candidates, and IC decay curves.
instructions: |
  Read AGENTS.md first. Do not emit trade instructions. On dependency gaps, mark
  insufficient and never fabricate metrics. Prefer python -m runtime for local runs.
  Research only; no return promises; no unofficial QuantSkills endorsement claims.
entry_point: AGENTS.md
runtime:
  local_command: python -m runtime --mock
