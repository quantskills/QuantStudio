name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node 22.19
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test installation entry point
        run: pnpm exec vitest run tests/application-bootstrap.spec.ts

      - name: Check source and types
        run: pnpm run check

      - name: Run plugin tests
        run: pnpm run test

      - name: Test managed updates and rollback
        run: pnpm run test:update

      - name: Test workspace platform compatibility
        run: pnpm exec vitest run packages/quantskills-session/tests/managed-workspace.spec.ts

      - name: Build publishable output
        run: pnpm run build

      - name: Smoke-test clean DSH installation
        run: pnpm run ci:smoke
