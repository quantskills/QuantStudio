name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        node: [22.19.0]
        include:
          - os: ubuntu-latest
            node: 24.0.0

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test installation entry point
        run: pnpm exec vitest run tests/application-bootstrap.spec.ts

      - name: Verify native subprocess containment
        run: pnpm exec vitest run tests/background-subprocess.spec.ts

      - name: Check source and types
        run: pnpm run check

      - name: Build publishable output
        run: pnpm run build

      - name: Test the complete candidate including migration, Team recovery and Trade
        run: pnpm exec vitest run

      - name: Smoke-test clean DSH installation
        run: pnpm run ci:smoke

      - name: Check out the fixed pre-upgrade baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8312624953d62a9aec5cde2c0c2f1175342482fe
          path: .ci-legacy-core
          persist-credentials: false

      - name: Install the old core without changing its versions
        run: pnpm --dir .ci-legacy-core install --frozen-lockfile

      - name: Verify the new launcher can still run the old core
        run: pnpm run ci:legacy -- .ci-legacy-core
